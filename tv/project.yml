name: FinopsTV
options:
  bundleIdPrefix: dev.finops
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true

packages:
  FinopsTerminal:
    path: ../app

targets:
  FinopsTV:
    type: application
    platform: tvOS
    sources:
      - Sources
    dependencies:
      - package: FinopsTerminal
        product: FinopsCore
      - package: FinopsTerminal
        product: FinopsDash
      - package: FinopsTerminal
        product: FinopsRemote
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: finops
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: finops finds finops-terminal on your Mac to show your dashboards and live market data.
        NSBonjourServices:
          - _finops._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.finops.tv
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
