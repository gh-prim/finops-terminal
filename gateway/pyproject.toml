[project]
name = "finops-gateway"
version = "0.1.0"
description = "Local data sidecar for finops-terminal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yfinance>=0.2.60",
    "pydantic>=2.8",
    "asyncpg>=0.30",
]

[project.scripts]
finops-gateway = "finops_gateway.__main__:main"
finops-admin = "finops_gateway.admin:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finops_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
