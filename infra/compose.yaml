# finops-terminal backend stack: data gateway (per-device auth) + Postgres + Redis.
# Exposed only on the tailnet, over HTTPS, by `tailscale serve` (see deploy.sh).
# Secrets come from /opt/finops/.env (generated by deploy.sh, mode 0600).
name: finops

services:
  postgres:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: finops
      POSTGRES_DB: finops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      TS_TUNE_MEMORY: 512MB
      TS_TUNE_NUM_CPUS: "2"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops -d finops"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 192m

  api:
    build: ../gateway
    image: finops-gateway:local
    restart: unless-stopped
    command: ["finops-gateway", "--host", "0.0.0.0", "--port", "8765", "--auth", "devices"]
    environment:
      FINOPS_CACHE_DIR: /data
      FRED_API_KEY: ${FRED_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FINOPS_EDGAR_CONTACT: ${EDGAR_CONTACT:-}
      DATABASE_URL: postgresql://finops:${POSTGRES_PASSWORD}@postgres:5432/finops
      REDIS_URL: redis://redis:6379/0
    volumes:
      - apidata:/data
    ports:
      - "127.0.0.1:8765:8765"   # only via `tailscale serve` (TLS on the tailnet) or SSH tunnels
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    mem_limit: 512m

volumes:
  pgdata:
  redisdata:
  apidata:
